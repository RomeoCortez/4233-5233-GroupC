# Isolated local/CI demonstration. Ports bind only to loopback.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run bash scripts/setup.sh first}
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  app1: &app
    image: ${NC_IMAGE:-nextcloud-group-c:ci}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Missing ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost app1 app2 lb edge"
      APACHE_DISABLE_REWRITE_IP: "1"
      # Fixed addresses apply only inside this demonstration network.
      TRUSTED_PROXIES: "172.29.73.10 172.29.73.11"
    volumes: ["nc_html:/var/www/html"]
    networks: [default]
  app2:
    <<: *app
  cron:
    <<: *app
    entrypoint: /cron.sh
  lb:
    image: nginx:stable-alpine
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks:
      default: {ipv4_address: 172.29.73.10}
  edge:
    image: httpd:2.4-alpine
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./certs:/certs:ro
    networks:
      default: {ipv4_address: 172.29.73.11}
volumes:
  db_data:
  nc_html:
networks:
  default:
    ipam:
      config: [{subnet: 172.29.73.0/24}]
